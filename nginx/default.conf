# Define the upstream pools
upstream users_upstream {
    server users-app-1:8080 max_fails=2 fail_timeout=10s;
    server users-app-2:8080 max_fails=2 fail_timeout=10s;
}

upstream orders_upstream {
    server orders-app:8080 max_fails=2 fail_timeout=10s;
}

server {
    listen 80 default_server;
    server_name _;

    # Route traffic based on URI path
    location /api/users/ {
        proxy_pass http://users_upstream/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/orders/ {
        proxy_pass http://orders_upstream/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}