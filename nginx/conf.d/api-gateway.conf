# Rate limiting
limit_req_zone $binary_remote_addr zone=orders_limit:10m rate=1r/s;

# Caching
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=users_cache:10m max_size=100m inactive=60m use_temp_path=off;


# Upstream pools
upstream users_upstream {
    server users-app-1:8080 max_fails=2 fail_timeout=10s;
    server users-app-2:8080 max_fails=2 fail_timeout=10s;
}

upstream orders_upstream {
    server orders-app:8080 max_fails=2 fail_timeout=10s;
}

# --- Port 80 Server: Force HTTPS ---
server {
    listen 80 default_server;
    server_name _;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# --- Port 443 Server: TLS Termination ---
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/nginx-selfsigned.key;

    include /etc/nginx/snippets/tls-params.conf;

    location /api/users/ {
        # Caching
        proxy_cache users_cache;
        proxy_cache_valid 200 1m;
        add_header x-Cache-Status $upstream_cache_status;

        proxy_pass http://users_upstream/;
        
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location /api/orders/ {
        # Rate limiting
        limit_req zone=orders_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://orders_upstream/;
        
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}