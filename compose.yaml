services:
  users-app-1:
    build:
      context: ./user-backend
      dockerfile: Dockerfile
    expose:
      - "8080"
  users-app-2:
    build:
      context: ./user-backend
      dockerfile: Dockerfile
    expose:
      - "8080"
  orders-app:
    build:
      context: ./order-backend
      dockerfile: Dockerfile
    expose:
      - "8080"
  nginx:
    image: nginx:stable-alpine-slim
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:r
      - ./nginx/cache:/var/cache/nginx
    depends_on:
      - users-app-1
      - users-app-2
      - orders-app
